{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg">
            <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
          </li>

          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign navigation_url = link.url %}
            {% else %}
              {% assign navigation_url = link.url | relative_url %}
            {% endif %}

            <li class="masthead__menu-item{% if page.url == link.url %} masthead__menu-item--active{% endif %}">
              <a href="{{ navigation_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
